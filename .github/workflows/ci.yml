name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Package extension
        run: |
          npm run package
          npx vsce package --out licenser.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: licenser-vsix
          path: licenser.vsix
